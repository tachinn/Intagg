<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="../media/favicons/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intagg — Admin Feedback</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700&family=Syne:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <style>
    .admin-container {
      padding: 120px 48px 60px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .admin-title {
      font-size: 32px;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .feedback-grid {
      display: grid;
      gap: 20px;
    }
    .feedback-card {
      background: rgba(245, 242, 238, 0.03);
      border: 1px solid rgba(245, 242, 238, 0.08);
      border-radius: 12px;
      padding: 24px;
      transition: all 0.2s;
    }
    .feedback-card:hover {
      background: rgba(245, 242, 238, 0.05);
      border-color: rgba(245, 242, 238, 0.15);
    }
    .fb-meta {
      display: flex;
      justify-content: space-between;
      color: var(--mid);
      font-size: 13px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .fb-email {
      color: var(--white);
      font-weight: 600;
      margin-bottom: 8px;
    }
    .fb-msg {
      color: var(--white);
      font-size: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .empty-state {
      text-align: center;
      color: var(--mid);
      padding: 60px;
      background: rgba(245, 242, 238, 0.02);
      border-radius: 12px;
      border: 1px dashed var(--border);
    }
  </style>
</head>

<body>

  <nav class="app-nav">
    <a href="../index.html" class="app-nav-logo" style="text-decoration: none; color: inherit;">intagg admin</a>
    <div class="nav-links">
      <a href="admin_feedback.html" class="nav-link active">Feedback</a>
      <a href="admin_stats.html" class="nav-link">Analytics</a>
      <a href="../internships.html" class="nav-link">Return to App</a>
    </div>
  </nav>

  <div class="admin-container">
    <div class="admin-title">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
      </svg>
      User Feedback
    </div>
    
    <div id="feedbackContainer" class="feedback-grid">
      <div class="empty-state">Loading feedback...</div>
    </div>
  </div>

  <script>
    async function loadFeedback() {
      const container = document.getElementById('feedbackContainer');
      try {
        const res = await fetch('http://127.0.0.1:5000/api/feedback');
        const data = await res.json();
        
        if (data.error) throw new Error(data.error);
        
        if (!data.feedback || data.feedback.length === 0) {
          container.innerHTML = '<div class="empty-state">No feedback found yet.</div>';
          return;
        }

        container.innerHTML = '';
        data.feedback.forEach(item => {
          const date = new Date(item.created_at).toLocaleString();
          const emailDisplay = item.email ? `<div class="fb-email">Email: <a href="mailto:${escapeHtml(item.email)}" style="color:var(--white);">${escapeHtml(item.email)}</a></div>` : '';
          const card = document.createElement('div');
          card.className = 'feedback-card';
          card.innerHTML = `
            <div class="fb-meta">
              <span><strong>ID:</strong> #${item.id}</span>
              <span>${date}</span>
            </div>
            ${emailDisplay}
            <div class="fb-msg">${escapeHtml(item.message)}</div>
          `;
          container.appendChild(card);
        });

      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="empty-state" style="color:red;">Failed to load feedback. Is the server running?</div>';
      }
    }

    function escapeHtml(unsafe) {
      if (!unsafe) return '';
      return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    document.addEventListener('DOMContentLoaded', loadFeedback);
  </script>
</body>
</html>
