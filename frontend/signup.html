<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/png" href="media/favicons/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intagg — Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700&family=Syne:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 0 40px 100px;
    }

    .auth-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--white);
    }

    .auth-text {
      font-size: 16px;
      color: var(--mid);
      margin-bottom: 32px;
      max-width: 500px;
    }

    .auth-box {
      width: 100%;
      max-width: 400px;
      background: rgba(245, 242, 238, 0.02);
      border: 1px solid rgba(245, 242, 238, 0.12);
      border-radius: 12px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .auth-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(245, 242, 238, 0.15);
      border-radius: 8px;
      padding: 16px;
      color: var(--white);
      font-family: 'Syne', sans-serif;
      font-size: 16px;
    }

    .auth-input:focus {
      outline: none;
      border-color: var(--white);
    }

    .auth-btn {
      background: var(--white);
      color: var(--black);
      border: none;
      padding: 16px;
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }

    .auth-btn:hover {
      background: var(--off-white);
      transform: translateY(-2px);
    }

    .auth-guest-btn {
      background: transparent;
      color: var(--mid);
      border: 1px solid var(--border);
      padding: 16px;
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .auth-guest-btn:hover {
      border-color: var(--white);
      color: var(--white);
    }

    .auth-link {
      color: var(--mid);
      font-size: 14px;
      margin-top: 16px;
    }

    .auth-link a {
      color: var(--white);
      text-decoration: none;
      font-weight: 600;
    }
    
    .auth-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <nav class="app-nav">
    <a href="index.html" class="app-nav-logo" style="text-decoration: none; color: inherit;">intagg</a>
  </nav>

  <div class="auth-container">
    <div class="auth-title">Create an account</div>
    <div class="auth-text">Join Intagg to unlock bookmarks and track applications.</div>

    <div class="auth-box">
      <input type="text" id="fullName" class="auth-input" placeholder="Full Name" required>
      <input type="email" id="email" class="auth-input" placeholder="Email Address" required>
      <input type="text" id="college" class="auth-input" placeholder="College / Organization">
      <input type="password" id="password" class="auth-input" placeholder="Password" required>
      
      <button class="auth-btn" onclick="signup()">Sign Up</button>
      
      <div style="display:flex; align-items:center; gap:8px; margin: 8px 0;">
        <div style="flex:1; height:1px; background:var(--border);"></div>
        <span style="color:var(--mid); font-size:12px;">OR</span>
        <div style="flex:1; height:1px; background:var(--border);"></div>
      </div>
      
      <button class="auth-guest-btn" onclick="window.location.href='internships.html'">Continue as Guest</button>
      
      <div class="auth-link">
        Already have an account? <a href="login.html">Log in</a>
      </div>
    </div>
  </div>

  <script>
    async function signup() {
      const full_name = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const college_or_org = document.getElementById('college').value;
      const password = document.getElementById('password').value;
      
      if (!full_name || !email || !password) {
        alert("Please fill out all required fields (Name, Email, Password).");
        return;
      }

      const btn = document.querySelector('.auth-btn');
      btn.innerText = 'Creating account...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ full_name, email, password, college_or_org })
        });
        
        const data = await res.json();
        if (data.success) {
          window.location.href = 'internships.html';
        } else {
          alert('Error: ' + (data.error || 'Failed to sign up.'));
        }
      } catch (err) {
        console.error(err);
        alert('Failed to connect to the server.');
      } finally {
        btn.innerText = 'Sign Up';
        btn.disabled = false;
      }
    }
  </script>

</body>
</html>
